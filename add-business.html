<!-- Selected Package Info Banner (Put near top of body or inside form) -->
<div id="packageSummaryCard" style="background: #e6fffa; border: 1px solid #b2f5ea; padding: 14px; border-radius: 12px; margin-bottom: 18px; display: none;">
  <h4 style="color: #234e52; font-size: 15px; font-weight: 700; margin-bottom: 4px;">
    <i class="fa-solid fa-box-open" style="color: #0b8f4d;"></i> Selected Package: <span id="pkgTitle"></span>
  </h4>
  <p style="font-size: 13px; color: #2c3e50; margin: 0;">
    Max Items Allowed: <strong id="pkgLimit"></strong> | Reg Fee: <strong id="pkgRegFee">UGX 3,000</strong>
  </p>
</div>

<script>
  // Read package from localStorage
  const savedPackage = JSON.parse(localStorage.getItem("selectedPackage"));

  if (!savedPackage) {
    // If user didn't pick a package, redirect back to packages.html
    window.location.href = "packages.html";
  } else {
    // Show selected package information on screen
    const summaryCard = document.getElementById("packageSummaryCard");
    if (summaryCard) {
      summaryCard.style.display = "block";
      document.getElementById("pkgTitle").textContent = savedPackage.packageName;
      document.getElementById("pkgLimit").textContent = `${savedPackage.itemLimit} Items`;
    }
  }

  // Handle Business Form Submission -> Save Draft & Proceed to Payment
  document.getElementById("businessForm")?.addEventListener("submit", function(e) {
    e.preventDefault();

    const businessDetails = {
      businessName: document.getElementById("businessName").value,
      category: document.getElementById("categorySelect").value,
      description: document.getElementById("description") ? document.getElementById("description").value : "",
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      package: savedPackage
    };

    localStorage.setItem("pendingBusinessDetails", JSON.stringify(businessDetails));
    
    // Redirect to Payment Page
    window.location.href = "payment.html";
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Escrow Checkout</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .cart-layout {
        grid-template-columns: 1fr 360px;
      }
    }

    /* Cart Items Table/List */
    .cart-items-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      border: 1px solid var(--border);
    }

    .empty-cart {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-cart i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--border);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 1.25rem;
      align-items: center;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #f1f5f9;
    }

    .item-details h4 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .item-price {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
    }

    .quantity-controls {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .qty-btn {
      background: #f8fafc;
      border: none;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .qty-btn:hover {
      background: #e2e8f0;
    }

    .qty-input {
      width: 36px;
      text-align: center;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-remove:hover {
      background: #fef2f2;
    }

    /* Summary Card */
    .summary-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      border: 1px solid var(--border);
      height: fit-content;
      position: sticky;
      top: 2rem;
    }

    .summary-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      border-top: 1px dashed var(--border);
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .escrow-badge {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
      margin: 1.25rem 0;
    }

    .escrow-badge i {
      font-size: 1.1rem;
      margin-top: 2px;
      color: var(--success);
    }

    /* Proceed Button */
    .btn-checkout {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.9rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    }

    .btn-checkout:hover {
      background-color: var(--primary-hover);
    }

    .btn-checkout:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="page-title">
      <i class="fa-solid fa-cart-shopping"></i> Shopping Cart
    </h1>

    <div class="cart-layout">
      <!-- Cart Items Section -->
      <div class="cart-items-card" id="cartItemsContainer">
        <!-- JS will populate items here -->
      </div>

      <!-- Order Summary Section -->
      <div class="summary-card">
        <h2 class="summary-title">Order Summary</h2>
        
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalAmount">$0.00</span>
        </div>
        
        <div class="summary-row">
          <span>Escrow Protection Fee</span>
          <span id="escrowFee">$0.00</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="grandTotal">$0.00</span>
        </div>

        <!-- Escrow Security Notice -->
        <div class="escrow-badge">
          <i class="fa-solid fa-shield-halved"></i>
          <div>
            <strong>Escrow Protection Active</strong>
            <p>Your payment is safely held until you receive and verify your order items.</p>
          </div>
        </div>

        <!-- Checkout Button connected to orders.html -->
        <button class="btn-checkout" id="checkoutBtn" onclick="proceedToCheckout()">
          <i class="fa-solid fa-shield-halved"></i> Proceed to Escrow Payment
        </button>
      </div>
    </div>
  </div>

  <script>
    // Sample Cart Initializer (Uses LocalStorage or loads fallback items)
    let cart = JSON.parse(localStorage.getItem('cart')) || [
      { id: 1, name: "Wireless Noise-Canceling Headphones", price: 120.00, quantity: 1, image: "https://via.placeholder.com/80" },
      { id: 2, name: "Ergonomic Mechanical Keyboard", price: 85.50, quantity: 2, image: "https://via.placeholder.com/80" }
    ];

    const ESCROW_FEE_PERCENT = 0.02; // 2% Escrow protection fee

    function renderCart() {
      const container = document.getElementById('cartItemsContainer');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <i class="fa-solid fa-cart-flatbed"></i>
            <h3>Your cart is empty</h3>
            <p>Add items to your cart to continue shopping.</p>
          </div>
        `;
        updateTotals(0);
        return;
      }

      let html = '';
      let subtotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        html += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" class="item-img">
            <div class="item-details">
              <h4>${item.name}</h4>
              <div class="item-price">$${item.price.toFixed(2)}</div>
              <div class="quantity-controls">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
              </div>
            </div>
            <button class="btn-remove" onclick="removeItem(${index})" title="Remove item">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
      });

      container.innerHTML = html;
      updateTotals(subtotal);
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateQty(index, change) {
      if (cart[index].quantity + change > 0) {
        cart[index].quantity += change;
      } else {
        cart.splice(index, 1);
      }
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function updateTotals(subtotal) {
      const escrowFee = subtotal * ESCROW_FEE_PERCENT;
      const total = subtotal + escrowFee;

      document.getElementById('subtotalAmount').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('escrowFee').textContent = `$${escrowFee.toFixed(2)}`;
      document.getElementById('grandTotal').textContent = `$${total.toFixed(2)}`;
    }

    // Function that connects cart.html to orders.html
    function proceedToCheckout() {
      if (cart.length === 0) {
        alert('Your cart is empty. Please add items before proceeding.');
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const escrowFee = subtotal * ESCROW_FEE_PERCENT;
      const grandTotal = subtotal + escrowFee;

      // Prepare order details to pass to orders.html
      const pendingOrder = {
        orderId: 'ESC-' + Math.floor(100000 + Math.random() * 900000),
        items: cart,
        subtotal: subtotal,
        escrowFee: escrowFee,
        grandTotal: grandTotal,
        createdAt: new Date().toISOString()
      };

      // Store pending order details in localStorage
      localStorage.setItem('pendingOrder', JSON.stringify(pendingOrder));

      // Redirect to orders.html
      window.location.href = 'orders.html';
    }

    // Initialize cart render on page load
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venx Market - Shopping Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #0b8f4d;
      --primary-dark: #086d3a;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #e2e8f0;
      --accent-gold: #f39c12;
      --nav-height: 65px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      background: var(--primary-color);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header a { color: white; text-decoration: none; font-size: 18px; }
    .header-title { font-size: 18px; font-weight: 700; flex-grow: 1; }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Section Cards */
    .card-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .card-title i { color: var(--primary-color); }

    /* Cart Items List */
    .cart-item {
      display: flex;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .cart-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .item-img {
      width: 65px;
      height: 65px;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .item-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-name { font-size: 13px; font-weight: 700; line-height: 1.3; }
    
    .item-origin {
      font-size: 11px;
      color: var(--primary-dark);
      background: #e2f7ed;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      margin-top: 3px;
      font-weight: 600;
    }

    .item-price-qty {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .price-tag { font-size: 13px; font-weight: 800; color: var(--primary-color); }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-weight: bold;
      cursor: pointer;
      width: 20px;
      height: 20px;
    }

    .qty-num { font-size: 12px; font-weight: 700; }

    /* Delivery Location Selector */
    .location-selector-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .select-wrapper select, .input-wrapper input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      outline: none;
      background: #f8fafc;
    }

    .gps-btn {
      background: #e2f7ed;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Distance & Transport Breakdown */
    .distance-info-badge {
      background: #f1f5f9;
      border-left: 4px solid var(--primary-color);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
    }

    .distance-info-badge div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .distance-info-badge div:last-child { margin-bottom: 0; }

    /* Summary Breakdown */
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .summary-row.total {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      margin-top: 6px;
    }

    .summary-row.total span:last-child {
      color: var(--primary-color);
    }

    .btn-checkout {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
    }

    .empty-cart-msg i {
      font-size: 40px;
      color: #cbd5e1;
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="header-title">My Cart</div>
  </header>

  <div class="container">

    <!-- Cart Items Section -->
    <div class="card-box">
      <div class="card-title">
        <i class="fa-solid fa-basket-shopping"></i> Order Items
      </div>
      <div id="cartItemsList">
        <div class="empty-cart-msg">
          <i class="fa-solid fa-cart-flatbed"></i>
          Your cart is currently empty.
        </div>
      </div>
    </div>

    <!-- Delivery & Transport Calculator Section -->
    <div class="card-box">
      <div class="card-title">
        <i class="fa-solid fa-truck-ramp-box"></i> Delivery Location & Distance
      </div>
      
      <div class="location-selector-group">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Select or Detect Buyer Delivery Location:</label>
        
        <div class="select-wrapper">
          <select id="buyerLocationSelect" onchange="calculateTransportFee()">
            <option value="Kyambogo">Kyambogo, Kampala</option>
            <option value="Kampala Central" selected>Kampala Central / City Centre</option>
            <option value="Nakawa">Nakawa Industrial Area</option>
            <option value="Wandegeya">Wandegeya, Kampala</option>
            <option value="Ntinda">Ntinda, Kampala</option>
            <option value="Bugolobi">Bugolobi, Kampala</option>
            <option value="Rubaga">Rubaga, Kampala</option>
            <option value="Makindye">Makindye, Kampala</option>
            <option value="Kawempe">Kawempe, Kampala</option>
            <option value="Mukono">Mukono Town</option>
            <option value="Entebbe">Entebbe Town</option>
          </select>
        </div>

        <button class="gps-btn" onclick="detectBuyerGPS()">
          <i class="fa-solid fa-location-crosshairs"></i> Use Current Device Location (GPS)
        </button>

        <!-- Distance & Fee Calculation Result -->
        <div class="distance-info-badge" id="distanceBadge">
          <div>
            <span>Origin Location(s):</span>
            <strong id="originLocText">Detecting...</strong>
          </div>
          <div>
            <span>Estimated Distance:</span>
            <strong id="distanceKmText">0.0 km</strong>
          </div>
          <div>
            <span>Transport Fee Rate:</span>
            <strong>UGX 800 / km (Base: 3,000)</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- Order Summary Section -->
    <div class="card-box">
      <div class="card-title">
        <i class="fa-solid fa-receipt"></i> Payment Summary
      </div>

      <div class="summary-row">
        <span>Items Subtotal</span>
        <span id="subtotalText">UGX 0</span>
      </div>
      <div class="summary-row">
        <span>Calculated Transport Fee</span>
        <span id="transportFeeText">UGX 0</span>
      </div>
      <div class="summary-row total">
        <span>Grand Total</span>
        <span id="grandTotalText">UGX 0</span>
      </div>

      <button class="btn-checkout" id="checkoutBtn" onclick="proceedToCheckout()">
        <i class="fa-solid fa-shield-halved"></i> Proceed to Escrow Payment
      </button>
    </div>

  </div>

  <script>
    // Known Hub Coordinates (Latitude & Longitude) in Uganda
    const LOCATION_COORDINATES = {
      "kyambogo": { lat: 0.3544, lng: 32.6288, name: "Kyambogo, Kampala" },
      "nakawa": { lat: 0.3300, lng: 32.6100, name: "Nakawa, Kampala" },
      "wandegeya": { lat: 0.3340, lng: 32.5680, name: "Wandegeya, Kampala" },
      "kampala central": { lat: 0.3136, lng: 32.5811, name: "Kampala Central" },
      "ntinda": { lat: 0.3580, lng: 32.6150, name: "Ntinda, Kampala" },
      "bugolobi": { lat: 0.3170, lng: 32.6130, name: "Bugolobi, Kampala" },
      "rubaga": { lat: 0.3010, lng: 32.5530, name: "Rubaga, Kampala" },
      "makindye": { lat: 0.2850, lng: 32.5830, name: "Makindye, Kampala" },
      "kawempe": { lat: 0.3700, lng: 32.5600, name: "Kawempe, Kampala" },
      "mukono": { lat: 0.3533, lng: 32.7553, name: "Mukono Town" },
      "entebbe": { lat: 0.0512, lng: 32.4637, name: "Entebbe Town" }
    };

    let cart = [];
    let activeBuyerCoords = LOCATION_COORDINATES["kampala central"];
    let currentTransportFee = 0;
    let currentSubtotal = 0;
    let calculatedDistanceKm = 0;

    // Load Cart Data on Page Load
    document.addEventListener("DOMContentLoaded", () => {
      loadCartItems();
    });

    function loadCartItems() {
      cart = JSON.parse(localStorage.getItem("venxCart") || "[]");
      const container = document.getElementById("cartItemsList");

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart-msg">
            <i class="fa-solid fa-cart-flatbed"></i>
            Your cart is currently empty.
          </div>
        `;
        document.getElementById("checkoutBtn").disabled = true;
        document.getElementById("checkoutBtn").style.opacity = "0.5";
        updateSummary(0, 0);
        return;
      }

      container.innerHTML = "";
      cart.forEach((item, index) => {
        const itemOrigin = item.location || item.businessLocation || "Kampala Central";
        
        const itemEl = document.createElement("div");
        itemEl.className = "cart-item";
        itemEl.innerHTML = `
          <img src="${item.image || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300'}" class="item-img" alt="${item.title}">
          <div class="item-info">
            <div>
              <div class="item-name">${item.title}</div>
              <div class="item-origin"><i class="fa-solid fa-store"></i> Origin: ${itemOrigin}</div>
            </div>
            <div class="item-price-qty">
              <span class="price-tag">UGX ${Number(item.price).toLocaleString()}</span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span class="qty-num">${item.quantity || 1}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(itemEl);
      });

      calculateTransportFee();
    }

    function updateQty(index, change) {
      if (!cart[index].quantity) cart[index].quantity = 1;
      cart[index].quantity += change;

      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      localStorage.setItem("venxCart", JSON.stringify(cart));
      loadCartItems();
    }

    // Convert address name to standard coordinates key
    function getCoordsFromLocationName(locationName) {
      if (!locationName) return LOCATION_COORDINATES["kampala central"];
      const lower = locationName.toLowerCase();
      
      for (const key in LOCATION_COORDINATES) {
        if (lower.includes(key)) {
          return LOCATION_COORDINATES[key];
        }
      }
      return LOCATION_COORDINATES["kampala central"];
    }

    // Haversine Distance Formula (calculates distance in km between 2 lat/lng points)
    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in kilometers
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c; 
    }

    // Automatic Transport Fee Calculation
    function calculateTransportFee() {
      if (cart.length === 0) return;

      const selectedBuyerLocName = document.getElementById("buyerLocationSelect").value;
      activeBuyerCoords = getCoordsFromLocationName(selectedBuyerLocName);

      // Collect all business origin locations from items in the cart
      let maxDistance = 0;
      let sellerLocations = [];

      currentSubtotal = cart.reduce((sum, item) => sum + (Number(item.price) * (item.quantity || 1)), 0);

      cart.forEach(item => {
        const originLocName = item.location || item.businessLocation || "Kampala Central";
        if (!sellerLocations.includes(originLocName)) {
          sellerLocations.push(originLocName);
        }

        const originCoords = getCoordsFromLocationName(originLocName);
        const dist = calculateHaversineDistance(
          activeBuyerCoords.lat, activeBuyerCoords.lng,
          originCoords.lat, originCoords.lng
        );

        if (dist > maxDistance) {
          maxDistance = dist;
        }
      });

      // Business logic for transport fee calculation:
      // Base fee = UGX 3,000 + (Distance in km * UGX 800)
      // Rounded to nearest 500 UGX
      calculatedDistanceKm = Math.max(1.2, parseFloat(maxDistance.toFixed(1)));
      const rawFee = 3000 + (calculatedDistanceKm * 800);
      currentTransportFee = Math.ceil(rawFee / 500) * 500;

      // Update UI elements
      document.getElementById("originLocText").innerText = sellerLocations.join(", ");
      document.getElementById("distanceKmText").innerText = `${calculatedDistanceKm} km`;
      
      updateSummary(currentSubtotal, currentTransportFee);

      // Save delivery calculation state into localStorage
      saveDeliveryDetailsToLocalStorage(selectedBuyerLocName, sellerLocations);
    }

    function detectBuyerGPS() {
      if (navigator.geolocation) {
        document.getElementById("distanceKmText").innerText = "Detecting GPS...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            activeBuyerCoords = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            
            // Recalculate using exact GPS coordinates
            let maxDistance = 0;
            let sellerLocations = [];

            cart.forEach(item => {
              const originLocName = item.location || item.businessLocation || "Kampala Central";
              if (!sellerLocations.includes(originLocName)) sellerLocations.push(originLocName);
              
              const originCoords = getCoordsFromLocationName(originLocName);
              const dist = calculateHaversineDistance(
                activeBuyerCoords.lat, activeBuyerCoords.lng,
                originCoords.lat, originCoords.lng
              );
              if (dist > maxDistance) maxDistance = dist;
            });

            calculatedDistanceKm = parseFloat(maxDistance.toFixed(1));
            const rawFee = 3000 + (calculatedDistanceKm * 800);
            currentTransportFee = Math.ceil(rawFee / 500) * 500;

            document.getElementById("originLocText").innerText = sellerLocations.join(", ");
            document.getElementById("distanceKmText").innerText = `${calculatedDistanceKm} km (Live GPS)`;
            
            updateSummary(currentSubtotal, currentTransportFee);
            saveDeliveryDetailsToLocalStorage("Live GPS Location", sellerLocations);
          },
          (error) => {
            alert("Could not retrieve device location. Using dropdown selection.");
            calculateTransportFee();
          }
        );
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }

    function updateSummary(subtotal, fee) {
      document.getElementById("subtotalText").innerText = `UGX ${subtotal.toLocaleString()}`;
      document.getElementById("transportFeeText").innerText = `UGX ${fee.toLocaleString()}`;
      document.getElementById("grandTotalText").innerText = `UGX ${(subtotal + fee).toLocaleString()}`;
    }

    // Save calculation data into LocalStorage for checkout / order processing
    function saveDeliveryDetailsToLocalStorage(buyerLocName, sellerLocations) {
      const deliveryDetails = {
        buyerDeliveryLocation: buyerLocName,
        buyerCoordinates: activeBuyerCoords,
        sellerBusinessLocations: sellerLocations,
        distanceKm: calculatedDistanceKm,
        transportFee: currentTransportFee,
        subtotal: currentSubtotal,
        grandTotal: currentSubtotal + currentTransportFee,
        updatedAt: new Date().toISOString()
      };

      localStorage.setItem("venxDeliveryDetails", JSON.stringify(deliveryDetails));
    }

    function proceedToCheckout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      
      // Redirect to checkout/payment page
      window.location.href = "checkout.html";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Venx Market</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Checkout - Venx Market</h2>
    <form id="checkout-form">
      <div class="form-group">
        <label for="buyerName">Full Name</label>
        <input type="text" id="buyerName" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required placeholder="256700000000">
      </div>

      <div class="form-group">
        <label for="amount">Amount (UGX)</label>
        <input type="number" id="amount" required placeholder="50000" min="1000">
      </div>

      <button type="submit" id="pay-btn">Pay Now with Pesapal</button>
    </form>
  </div>

  <script>
    document.getElementById('checkout-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const payBtn = document.getElementById('pay-btn');
      payBtn.innerText = "Processing Payment...";
      payBtn.disabled = true;

      const orderData = {
        orderId: "ORD-" + Date.now(),
        amount: parseFloat(document.getElementById('amount').value),
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        buyerName: document.getElementById('buyerName').value
      };

      try {
        const response = await fetch('https://g-links-backend.onrender.com/api/payments/initiate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(orderData)
        });

        const result = await response.json();

        if (result.paymentUrl) {
          // Redirect user to Pesapal payment portal
          window.location.href = result.paymentUrl;
        } else {
          alert("Payment Error: " + (result.error || result.message || "Could not initiate payment."));
          payBtn.innerText = "Pay Now with Pesapal";
          payBtn.disabled = false;
        }
      } catch (error) {
        console.error("Payment Error:", error);
        alert("Unable to reach the payment server. Please try again.");
        payBtn.innerText = "Pay Now with Pesapal";
        payBtn.disabled = false;
      }
    }); </script>
</body>
</html>
